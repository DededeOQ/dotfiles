# --- FUENTES Y RENDIMIENTO ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Optimización para renderizado rápido
disable_ligatures never
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# --- DISEÑO Y DIMENSIONES EN COLUMNAS/FILAS (120x35) ---
remember_window_size  no
initial_window_width  120c
initial_window_height 35c
window_padding_width  12

# Mantener look minimalista sin barra de título
hide_window_decorations yes
background_opacity 0.90
dynamic_background_opacity yes
confirm_os_window_close 0

# --- COLORES (Catppuccin Mocha) ---
foreground            #cdd6f4
background            #1e1e2e
selection_foreground  #1e1e2e
selection_background  #f5e0dc

# Colores del Cursor
cursor                #f5e0dc
cursor_text_color     #1e1e2e
cursor_shape          beam
cursor_blink_interval 0.5

# Colores Normales
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #cba6f7
color6 #94e2d5
color7 #bac2de

# Colores Brillantes
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8

# --- PESTAÑAS (Tabs) ---
tab_bar_style       powerline
tab_powerline_style angled
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# --- ATAJOS DE TECLADO CLAVE ---
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Cambiar opacidad al vuelo
map ctrl+shift+u set_background_opacity +0.05
map ctrl+shift+d set_background_opacity -0.05

# Recargar configuración sin cerrar la terminal
map ctrl+shift+f5 load_config_file

# Elegir un tema
theme = "onedark"

[editor]
# Muestra numeros de linea relativos (utiles para moverte con j/k). Tambien puede ser absolute
line-number = "relative"

# Mueve el cursor a la columna actual
cursorcolumn = true

# Muestra una linea vertical como guia en la columna 80
rulers = [80]

# Si usas una terminal con soporte True Color (la mayoria hoy en dia), dejalo asi.
true-color = true

# Agrega un poco de espacio alrededor del cursor al hacer scroll (5 lineas es buen valor)
scrolloff = 5

# Comportamiento del portapapeles del sistema. Descomenta una de las siguientes líneas:
# [editor.clipboard]
# proveedor = "wl-copy"  # Para Wayland
# proveedor = "xclip"    # Para X11

# Cambiar la forma del cursor segun el modo
[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

# Configurar la linea de estado (statusline) para que muestre informacion util
[editor.statusline]
left = ["mode", "spinner", "file-name"]
center = []
right = ["diagnostics", "selections", "position", "position-percentage"]
